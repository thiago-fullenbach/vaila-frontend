<mat-card class="mx-auto my-6 p-6 max-w-xl items-center gap-4">
  <mat-card-header>
    <mat-card-title>URLs Cadastradas</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    @if (loading()) {
      <mat-spinner class="mx-auto my-4" />
    }

    <table [hidden]="loading()" mat-table [dataSource]="dataSource">
      <ng-container matColumnDef="hash">
        <th mat-header-cell *matHeaderCellDef>Hash</th>
        <td mat-cell *matCellDef="let url">{{ url.hash }}</td>
      </ng-container>

      <ng-container matColumnDef="url">
        <th mat-header-cell *matHeaderCellDef>URL</th>
        <td mat-cell *matCellDef="let url">
          <a [href]="baseUrl + url.shortUrl" [title]="url.originalUrl" target="_blank" rel="noopener noreferrer">
            <fa-icon class="mr-4" icon="arrow-up-right-from-square" />
            <span class="hidden md:inline">{{ url.shortUrl }}</span>
          </a>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let url">
          <button class="mr-2" matButton="text" (click)="copyUrl(url.shortUrl)"><fa-icon icon="copy" /></button>
          <button matButton="text" (click)="deleteUrl(url.hash)"><fa-icon class="text-red-900" icon="trash" /></button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [length]="totalUrls" [pageSize]="pageSize" showFirstLastButtons
      aria-label="Selecione a página de URLs">
    </mat-paginator>
  </mat-card-content>
</mat-card>
